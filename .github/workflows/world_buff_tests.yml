name: World Buff Checker tests
on:
  push:
  pull_request:
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: leafo/gh-actions-lua@v11.0.0
        with:
          luaVersion: "5.1.4"
      - run: lua tests/world_buff_checker_spec.lua
      - run: lua tests/world_buff_gui_spec.lua
